services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:18
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init:/init:ro
    entrypoint: ["sh", "-c", "for f in /init/*.sql; do echo \"running $$f\"; psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  tyk-redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  tyk-gateway:
    image: tykio/tyk-gateway:v5.8.16
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./tyk-gateway/tyk.conf:/opt/tyk-gateway/tyk.conf:ro
      - ./tyk-gateway/apps:/opt/tyk-gateway/apps:ro
      - ./tyk-gateway/middleware:/opt/tyk-gateway/middleware:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tyk-redis

volumes:
  pgdata:
  kafkadata:
