services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:18
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init:/init:ro
    entrypoint: ["sh", "-c", "for f in /init/*.sql; do echo \"running $$f\"; psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USERNAME: app-user-service
      DB_PASSWORD: secret
      JWT_ISSUER: http://user-service:8080
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      db-init:
        condition: service_completed_successfully

  tyk-redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  tyk-gateway:
    image: tykio/tyk-gateway:v5.8.16
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./tyk-gateway/tyk.conf:/opt/tyk-gateway/tyk.conf:ro
      - ./tyk-gateway/apps:/opt/tyk-gateway/apps:ro
    depends_on:
      - tyk-redis
      - user-service

secrets:
  jwt_private_key:
    file: ./services/user-service/certs/private.pem
  jwt_public_key:
    file: ./services/user-service/certs/public.pem

volumes:
  pgdata:
