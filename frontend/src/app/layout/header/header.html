<header class="sticky top-0 z-50 border-b border-zinc-900/5 bg-cream/90 backdrop-blur">
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="font-display text-2xl font-bold tracking-tight" aria-label="Keroma home" (click)="closeMenu()">
      keroma<span class="text-brand-500">.</span>
    </a>

    <div class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.fragment) {
        <a
          routerLink="/"
          [fragment]="link.fragment"
          class="text-sm text-zinc-600 transition-colors hover:text-zinc-900"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <div class="hidden items-center gap-6 md:flex">
      <a routerLink="/login" class="text-sm font-medium text-zinc-700 transition-colors hover:text-zinc-900">Log in</a>
      <a
        routerLink="/register"
        class="rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-zinc-700"
      >
        Sign up
      </a>
    </div>

    <button
      type="button"
      class="-mr-2 grid size-10 place-items-center text-zinc-700 md:hidden"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'x-mark' : 'bars'" class="size-6" />
    </button>
  </nav>

  @if (menuOpen()) {
    <div id="mobile-menu" class="border-t border-zinc-900/5 bg-cream px-4 pb-6 pt-2 md:hidden">
      @for (link of links; track link.fragment) {
        <a
          routerLink="/"
          [fragment]="link.fragment"
          class="block border-b border-zinc-900/5 py-3 text-base text-zinc-800"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      <div class="mt-5 grid grid-cols-2 gap-3">
        <a
          routerLink="/login"
          class="rounded-lg border border-zinc-300 py-2.5 text-center text-sm font-medium text-zinc-800"
          (click)="closeMenu()"
        >
          Log in
        </a>
        <a
          routerLink="/register"
          class="rounded-lg bg-zinc-900 py-2.5 text-center text-sm font-medium text-white"
          (click)="closeMenu()"
        >
          Sign up
        </a>
      </div>
    </div>
  }
</header>
