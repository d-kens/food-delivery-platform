<footer class="bg-zinc-950 text-zinc-400">
  <div class="mx-auto max-w-7xl px-4 pb-10 pt-16 sm:px-6 lg:px-8">
    <div class="grid gap-12 md:grid-cols-5">
      <div class="md:col-span-2">
        <a routerLink="/" class="font-display text-2xl font-bold tracking-tight text-white" aria-label="Keroma home">
          keroma<span class="text-brand-500">.</span>
        </a>
        <p class="mt-4 max-w-xs text-sm leading-6">
          Meals from the restaurants you love, delivered across Nairobi.
        </p>
      </div>

      @for (column of columns; track column.title) {
        <div>
          <h3 class="text-sm font-medium text-white">{{ column.title }}</h3>
          <ul class="mt-4 space-y-3">
            @for (link of column.links; track link) {
              <li>
                <a href="#" class="text-sm transition-colors hover:text-white">{{ link }}</a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div class="mt-16 flex flex-col gap-2 border-t border-white/10 pt-8 text-xs sm:flex-row sm:justify-between">
      <p>&copy; {{ year }} Keroma Ltd. All rights reserved.</p>
      <p>Nairobi, Kenya</p>
    </div>
  </div>
</footer>
