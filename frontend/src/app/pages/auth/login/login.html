<h1 class="font-display text-3xl font-bold tracking-tight">Welcome back</h1>
<p class="mt-2 text-zinc-600">Log in to order from your favourite restaurants.</p>

@if (justRegistered()) {
  <p class="mt-5 rounded-lg bg-emerald-50 px-3.5 py-2.5 text-sm text-emerald-800 ring-1 ring-emerald-200" role="status">
    Account created. Log in to start ordering.
  </p>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="mt-6 space-y-1">
  <div>
    <label for="email" class="form-label">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      placeholder="you@example.com"
      class="form-input"
      aria-describedby="email-message"
      [attr.aria-invalid]="error('email') ? true : null"
    />
    <app-field-message fieldId="email" [error]="error('email')" />
  </div>

  <div>
    <label for="password" class="form-label">Password</label>
    <div class="relative">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        class="form-input pr-12"
        aria-describedby="password-message"
        [attr.aria-invalid]="error('password') ? true : null"
        (keydown)="onPasswordKey($event)"
        (keyup)="onPasswordKey($event)"
        (blur)="capsLock.set(false)"
      />
      <button
        type="button"
        class="absolute top-1/2 right-1 grid size-10 -translate-y-1/2 place-items-center rounded-md text-zinc-500 hover:text-zinc-800 focus-visible:outline-2 focus-visible:outline-zinc-900"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword()"
        (click)="showPassword.set(!showPassword())"
      >
        <ng-icon [name]="showPassword() ? 'heroEyeSlash' : 'heroEye'" size="20" />
      </button>
    </div>
    <div class="flex items-start justify-between gap-3">
      <app-field-message
        class="flex-1"
        fieldId="password"
        [error]="error('password') ?? formError()"
        [warning]="capsLock() ? 'Caps Lock is on' : null"
      />
      <a href="#" class="mt-1 shrink-0 text-xs leading-4 font-medium text-brand-600 hover:text-brand-700">
        Forgot password?
      </a>
    </div>
  </div>

  <div class="pt-3">
    <button type="submit" class="btn-primary gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <app-spinner />
        Logging in…
      } @else {
        Log in
      }
    </button>
  </div>
</form>

<div class="my-4 flex items-center gap-3 text-xs text-zinc-500">
  <span class="h-px flex-1 bg-zinc-200"></span>
  or
  <span class="h-px flex-1 bg-zinc-200"></span>
</div>

<app-google-button />

<p class="mt-5 text-center text-sm text-zinc-600">
  New to Keroma?
  <a routerLink="/register" queryParamsHandling="preserve" class="font-semibold text-brand-600 hover:text-brand-700">
    Create an account
  </a>
</p>
