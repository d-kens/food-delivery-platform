<h1 class="font-display text-3xl font-bold tracking-tight">Create your account</h1>
<p class="mt-2 text-zinc-600">Order from Nairobi's best restaurants in minutes.</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="mt-6 space-y-1">
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label for="firstName" class="form-label">First name</label>
      <input
        id="firstName"
        type="text"
        formControlName="firstName"
        autocomplete="given-name"
        autocapitalize="words"
        class="form-input"
        aria-describedby="firstName-message"
        [attr.aria-invalid]="error('firstName') ? true : null"
      />
      <app-field-message fieldId="firstName" [error]="error('firstName')" />
    </div>
    <div>
      <label for="lastName" class="form-label">Last name</label>
      <input
        id="lastName"
        type="text"
        formControlName="lastName"
        autocomplete="family-name"
        autocapitalize="words"
        class="form-input"
        aria-describedby="lastName-message"
        [attr.aria-invalid]="error('lastName') ? true : null"
      />
      <app-field-message fieldId="lastName" [error]="error('lastName')" />
    </div>
  </div>

  <div>
    <label for="email" class="form-label">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
      placeholder="you@example.com"
      class="form-input"
      aria-describedby="email-message"
      [attr.aria-invalid]="error('email') ? true : null"
    />
    <app-field-message fieldId="email" [error]="error('email')" />
  </div>

  <div>
    <label for="password" class="form-label">
      Password <span class="font-normal text-zinc-500">(8+ characters)</span>
    </label>
    <div class="relative">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
        class="form-input pr-12"
        aria-describedby="password-message"
        [attr.aria-invalid]="error('password') ? true : null"
        (keydown)="onPasswordKey($event)"
        (keyup)="onPasswordKey($event)"
        (blur)="capsLock.set(false)"
      />
      <button
        type="button"
        class="absolute top-1/2 right-1 grid size-10 -translate-y-1/2 place-items-center rounded-md text-zinc-500 hover:text-zinc-800 focus-visible:outline-2 focus-visible:outline-zinc-900"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword()"
        (click)="showPassword.set(!showPassword())"
      >
        <ng-icon [name]="showPassword() ? 'heroEyeSlash' : 'heroEye'" size="20" />
      </button>
    </div>
    <app-field-message
      fieldId="password"
      [error]="error('password') ?? formError()"
      [warning]="capsLock() ? 'Caps Lock is on' : null"
    />
  </div>

  <div class="space-y-3 pt-3">
    <button type="submit" class="btn-primary gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <app-spinner />
        Creating your account…
      } @else {
        Create account
      }
    </button>

    <p class="text-center text-xs text-zinc-500">
      By signing up you agree to our
      <a href="#" class="underline underline-offset-2 hover:text-zinc-800">Terms</a> and
      <a href="#" class="underline underline-offset-2 hover:text-zinc-800">Privacy Policy</a>.
    </p>
  </div>
</form>

<div class="my-4 flex items-center gap-3 text-xs text-zinc-500">
  <span class="h-px flex-1 bg-zinc-200"></span>
  or
  <span class="h-px flex-1 bg-zinc-200"></span>
</div>

<app-google-button label="Sign up with Google" />

<p class="mt-5 text-center text-sm text-zinc-600">
  Already have an account?
  <a routerLink="/login" queryParamsHandling="preserve" class="font-semibold text-brand-600 hover:text-brand-700">
    Log in
  </a>
</p>
