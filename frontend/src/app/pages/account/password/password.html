<app-settings-section
  heading="Change password"
  description="Use a password you don't use for any other site. You'll be logged out on every device afterwards, including this one."
  headingId="password-heading"
>
  <form class="settings-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="grid gap-x-4 gap-y-1 p-6 sm:grid-cols-2">
      @for (field of fields; track field.id) {
        <div [class]="field.wide ? 'sm:col-span-2' : ''">
          <label [for]="field.id" class="form-label">{{ field.label }}</label>
          <div class="relative">
            <input
              [id]="field.id"
              [type]="isVisible(field.id) ? 'text' : 'password'"
              [formControlName]="field.id"
              [autocomplete]="field.autocomplete"
              class="form-input pr-12"
              [attr.aria-describedby]="field.id + '-message'"
              [attr.aria-invalid]="isInvalid(field.id) ? true : null"
            />
            <button
              type="button"
              class="absolute top-1/2 right-1 grid size-10 -translate-y-1/2 place-items-center rounded-md text-zinc-400 hover:text-zinc-700 focus-visible:outline-2 focus-visible:outline-zinc-900"
              [attr.aria-label]="
                (isVisible(field.id) ? 'Hide ' : 'Show ') + field.label.toLowerCase()
              "
              [attr.aria-pressed]="isVisible(field.id)"
              (click)="toggleVisible(field.id)"
            >
              <ng-icon [name]="isVisible(field.id) ? 'heroEyeSlash' : 'heroEye'" size="18" />
            </button>
          </div>
          <app-field-message [fieldId]="field.id" [error]="error(field.id)" />
        </div>
      }

      <ul
        class="flex flex-wrap gap-x-5 gap-y-1.5 text-xs font-medium sm:col-span-2"
        aria-label="Password requirements"
      >
        @for (rule of requirements(); track rule.label) {
          <li
            class="flex items-center gap-1.5 transition-colors"
            [class]="rule.met ? 'text-emerald-700' : 'text-zinc-500'"
          >
            @if (rule.met) {
              <ng-icon
                name="heroCheckCircleSolid"
                size="16"
                class="text-emerald-600"
                aria-hidden="true"
              />
            } @else {
              <span
                class="size-3.5 rounded-full border-2 border-zinc-300"
                aria-hidden="true"
              ></span>
            }
            {{ rule.label }}
            <span class="sr-only">{{ rule.met ? '(met)' : '(not met)' }}</span>
          </li>
        }
      </ul>

      <app-form-alert class="pt-4 sm:col-span-2" [message]="formError()" />
    </div>

    <div class="flex justify-end border-t border-zinc-100 px-6 py-4">
      <button type="submit" class="btn-primary h-10 w-auto gap-2 px-4" [disabled]="submitting()">
        @if (submitting()) {
          <app-spinner />
          Changing password…
        } @else {
          Change password
        }
      </button>
    </div>
  </form>
</app-settings-section>
