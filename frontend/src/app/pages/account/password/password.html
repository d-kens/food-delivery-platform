<h2 class="text-lg font-semibold">Change password</h2>
<p class="mt-1 text-sm text-zinc-600">
  After changing your password you'll be logged out on every device, including this one.
</p>

@if (formError()) {
  <p
    class="mt-5 rounded-lg bg-red-50 px-3.5 py-2.5 text-sm text-red-800 ring-1 ring-red-200"
    role="alert"
  >
    {{ formError() }}
  </p>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="mt-6 space-y-1 sm:max-w-sm">
  <div>
    <label for="currentPassword" class="form-label">Current password</label>
    <input
      id="currentPassword"
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
      class="form-input"
      aria-describedby="currentPassword-message"
      [attr.aria-invalid]="error('currentPassword') ? true : null"
    />
    <app-field-message fieldId="currentPassword" [error]="error('currentPassword')" />
  </div>

  <div>
    <label for="newPassword" class="form-label">New password</label>
    <input
      id="newPassword"
      type="password"
      formControlName="newPassword"
      autocomplete="new-password"
      class="form-input"
      aria-describedby="newPassword-message"
      [attr.aria-invalid]="error('newPassword') ? true : null"
    />
    <app-field-message
      fieldId="newPassword"
      [error]="error('newPassword')"
      hint="At least 8 characters"
    />
  </div>

  <div>
    <label for="confirmPassword" class="form-label">Confirm new password</label>
    <input
      id="confirmPassword"
      type="password"
      formControlName="confirmPassword"
      autocomplete="new-password"
      class="form-input"
      aria-describedby="confirmPassword-message"
      [attr.aria-invalid]="error('confirmPassword') ? true : null"
    />
    <app-field-message fieldId="confirmPassword" [error]="error('confirmPassword')" />
  </div>

  <div class="pt-3">
    <button type="submit" class="btn-primary gap-2" [disabled]="submitting()">
      @if (submitting()) {
        <app-spinner />
        Changing password…
      } @else {
        Change password
      }
    </button>
  </div>
</form>
