<app-settings-section
  heading="Personal info"
  description="Your name and contact details. Your email is also how you log in."
  headingId="profile-heading"
>
  <form class="settings-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="grid gap-x-4 gap-y-1 p-6 sm:grid-cols-2">
      <div>
        <label for="firstName" class="form-label">First name</label>
        <input
          id="firstName"
          formControlName="firstName"
          autocomplete="given-name"
          class="form-input"
          aria-describedby="firstName-message"
          [attr.aria-invalid]="isInvalid('firstName') ? true : null"
        />
        <app-field-message fieldId="firstName" [error]="error('firstName')" />
      </div>

      <div>
        <label for="lastName" class="form-label">Last name</label>
        <input
          id="lastName"
          formControlName="lastName"
          autocomplete="family-name"
          class="form-input"
          aria-describedby="lastName-message"
          [attr.aria-invalid]="isInvalid('lastName') ? true : null"
        />
        <app-field-message fieldId="lastName" [error]="error('lastName')" />
      </div>

      <div class="sm:col-span-2">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          autocapitalize="none"
          spellcheck="false"
          class="form-input"
          aria-describedby="email-message"
          [attr.aria-invalid]="isInvalid('email') ? true : null"
        />
        <app-field-message fieldId="email" [error]="error('email')" />
      </div>

      @if (emailChanged()) {
        <div class="mb-3 rounded-xl bg-amber-50 p-4 ring-1 ring-amber-200 sm:col-span-2">
          <label for="currentPassword" class="form-label">Current password</label>
          <input
            id="currentPassword"
            type="password"
            formControlName="currentPassword"
            autocomplete="current-password"
            class="form-input"
            aria-describedby="currentPassword-message"
            [attr.aria-invalid]="isInvalid('currentPassword') ? true : null"
          />
          <app-field-message
            fieldId="currentPassword"
            [error]="error('currentPassword')"
            hint="Needed to confirm it's you before changing your email"
          />
        </div>
      }

      <div>
        <label for="phoneNumber" class="form-label"
          >Phone number <span class="font-normal text-zinc-500">(optional)</span></label
        >
        <input
          id="phoneNumber"
          type="tel"
          formControlName="phoneNumber"
          autocomplete="tel"
          placeholder="+254712345678"
          class="form-input"
          aria-describedby="phoneNumber-message"
          [attr.aria-invalid]="isInvalid('phoneNumber') ? true : null"
        />
        <app-field-message
          fieldId="phoneNumber"
          [error]="error('phoneNumber')"
          hint="Include the country code"
        />
      </div>

      <app-form-alert class="pt-2 sm:col-span-2" [message]="formError()" />
    </div>

    <div class="flex items-center justify-end gap-3 border-t border-zinc-100 px-6 py-4">
      <button
        type="button"
        class="btn-secondary"
        [disabled]="!hasChanges() || submitting()"
        (click)="discard()"
      >
        Discard
      </button>
      <button
        type="submit"
        class="btn-primary h-10 w-auto gap-2 px-4"
        [disabled]="!hasChanges() || submitting()"
      >
        @if (submitting()) {
          <app-spinner />
          Saving…
        } @else {
          Save changes
        }
      </button>
    </div>
  </form>
</app-settings-section>
