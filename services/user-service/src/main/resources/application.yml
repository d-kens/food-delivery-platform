spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USERNAME:app-user-service}
    password: ${DB_PASSWORD:secret}
  liquibase:
    change-log: classpath:db/changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate
