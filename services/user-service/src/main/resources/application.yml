spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USERNAME:app-user-service}
    password: ${DB_PASSWORD:secret}
  liquibase:
    change-log: classpath:db/changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: ${GOOGLE_REDIRECT_URI}


kafka:
  topics:
    user-events: user-events
    notifications: notifications

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    key-id:  ${JWT_KEY_ID:user-service-key-1}
    expiration: ${JWT_EXPIRATION:15m}
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:certs/private.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:certs/public.pem}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-path: ${JWT_COOKIE_PATH:/api}

  password-reset:
    ttl: ${PASSWORD_RESET_TTL:30m}
    request-interval: ${PASSWORD_RESET_REQUEST_INTERVAL:1m}
    url: ${PASSWORD_RESET_URL:http://localhost:4200/reset-password}

  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/user-service/auth}

  google:
    success-url: ${GOOGLE_SUCCESS_URL:http://localhost:4200/}
    failure-url: ${GOOGLE_FAILURE_URL:http://localhost:4200/login?error=google}
