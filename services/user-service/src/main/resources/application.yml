spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USERNAME:app-user-service}
    password: ${DB_PASSWORD:secret}
  liquibase:
    change-log: classpath:db/changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    key-id:  ${JWT_KEY_ID:user-service-key-1}
    expiration: ${JWT_EXPIRATION:15m}
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:certs/private.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:certs/public.pem}

  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
