services:
  user-service-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app-user-service
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: users
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - user_service_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app-user-service -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  user_service_pgdata:
