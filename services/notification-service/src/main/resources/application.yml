spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true

kafka:
  topics:
    user-events: user-events

novu:
  api:
    key: ${NOVU_SECRET}
